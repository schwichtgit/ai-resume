[project]
name = "ingest"
version = "0.1.1"
description = "Memvid ingestion pipeline for AI Resume - runs natively on MacOS for NPU acceleration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "memvid-sdk==2.0.160",
    "sentence-transformers>=5.4.0",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "numpy>=1.24.0",
]
lint = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[dependency-groups]
dev = []

# New group for local developer utilities
tools = [
    "it2 @ git+https://github.com/mkusaka/it2.git",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ingest", "compare_models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "memvid_sdk",
    "memvid_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = ["-v", "--strict-markers", "--tb=short", "--cov=ingest", "--cov-report=term-missing", "--cov-fail-under=85"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: async test marker (pytest-asyncio)",
]

[tool.coverage.run]
source = ["ingest"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
