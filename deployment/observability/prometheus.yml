global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-service
    static_configs:
      - targets:
          # Replace with actual api-service host:port
          # e.g., "api-service:3000" or use host.containers.internal
          - 'host.containers.internal:3000'

  - job_name: memvid-service
    static_configs:
      - targets:
          # memvid metrics are on port 9090 (METRICS_PORT, default 9090);
          # 50051 is the gRPC port and does not serve /metrics.
          # e.g., "memvid-service:9090"
          - 'host.containers.internal:9090'

  - job_name: tempo-metrics
    static_configs:
      - targets:
          - 'tempo:3200'
