# Fluent Bit - Container log shipper for Loki
# Tails podman container logs and forwards to Loki via HTTP push API.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Primary: /var/log/containers/*.log (standard k8s-file log driver output)
# For overlay-containers layout (macOS podman VM default), set PODMAN_LOG_ROOT
# to the parent dir and adjust Path accordingly, or use --log-opt path=...
# per container to write to /var/log/containers/.
[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               container.*
    Refresh_Interval  10
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Read_from_Head    False

[FILTER]
    Name         modify
    Match        container.*
    Add          host ${HOSTNAME}
    Add          service ai-resume

[OUTPUT]
    Name         loki
    Match        container.*
    Host         ${LOKI_HOST}
    Port         ${LOKI_PORT}
    Labels       container_name, service, host
    Auto_Kubernetes_Labels Off
    Retry_Limit  5
