<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the stored theme before first paint, so a dark-mode page does not
      flash the light theme while the app loads. Same storage key and default
      as the ThemeProvider in src/App.tsx; next-themes' own script for this
      never runs in a client-only app.
    -->
    <script data-theme-init>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          // Storage blocked: keep the default.
        }
        var root = document.documentElement;
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <title>AI Resume — Loading</title>
    <meta
      name="description"
      content="AI-powered interactive resume. Ask questions about experience, skills, and role fit."
    />

    <!-- Dynamic meta tags: Bots get SEO endpoint, humans get React app which updates these -->
    <meta property="og:title" content="AI Resume" />
    <meta
      property="og:description"
      content="Interactive AI resume with intelligent Q&A about professional experience and role fit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/ai-resume.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Resume" />
    <meta
      name="twitter:description"
      content="AI-powered professional portfolio with intelligent Q&A."
    />
    <meta name="twitter:image" content="/ai-resume.png" />

    <meta name="model-context" content="/mcp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
