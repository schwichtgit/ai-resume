[project]
name = "api-service"
version = "1.0.1"
description = "Python FastAPI service for AI Resume - handles API orchestration and OpenRouter LLM integration"
authors = []
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.136.3",
    "starlette>=0.49.1",
    "setuptools>=82.0.1",
    "uvicorn[standard]>=0.44.0",
    "python-multipart>=0.0.28",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "structlog>=25.5.0",
    "cachetools>=7.1.4",
    "slowapi>=0.1.9",
    "fastmcp>=3.3.1",
    "opentelemetry-exporter-otlp>=1.42.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
lint = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "types-cachetools>=7.0.0.20260503",
]
sbom = [
    "poetry>=2.4.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_resume_api"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
warn_unused_ignores = true
strict_equality = true
exclude = [
    "ai_resume_api/proto/",
    "app/",  # symlink to ai_resume_api, avoid scanning twice
]

[[tool.mypy.overrides]]
module = [
    "ai_resume_api.proto.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "structlog.*",
    "slowapi.*",
    "prometheus_fastapi_instrumentator.*",
    "google.protobuf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fixtures.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ai_resume_api/proto/"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=ai_resume_api --cov-report=term-missing"
markers = [
    "slow: marks tests that require external services (deselect with '-m \"not slow\"')",
    "e2e: end-to-end acceptance tests (deselect with '-m \"not e2e\"')",
]
