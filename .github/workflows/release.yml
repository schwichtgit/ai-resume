name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  checks: read
  security-events: write

env:
  REGISTRY: ghcr.io/schwichtgit

jobs:
  # Gate: verify CI passed and changelog has an entry for this version
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version and detect pre-release
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CI status
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit ${SHA}..."

          # Find the most recent completed CI run for this commit
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::CI has not passed on commit ${SHA}"
            echo "No completed CI workflow run found for this commit."
            exit 1
          fi

          # Check that the summary job concluded with success
          SUMMARY_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "summary") | .conclusion')

          if [ "$SUMMARY_CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed on commit ${SHA}"
            echo "Summary job conclusion: ${SUMMARY_CONCLUSION:-not found}"
            exit 1
          fi

          echo "CI passed (run ${RUN_ID}, summary: ${SUMMARY_CONCLUSION})"

      - name: Validate changelog entry
        if: steps.version.outputs.prerelease == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version $VERSION"
            echo "Expected a heading like: ## [$VERSION]"
            exit 1
          fi
          echo "Changelog entry found for version $VERSION"

  # Merge arch-specific images (built in CI) into multi-arch manifests
  merge-manifests:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ai-resume-frontend, ai-resume-api, ai-resume-memvid, ai-resume-ingest]
    steps:
      - uses: actions/checkout@v6

      - name: Login to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge arch manifests
        run: |
          chmod +x scripts/publish-ci.sh
          scripts/publish-ci.sh merge "${{ env.REGISTRY }}" "${{ matrix.image }}" "${{ github.ref_name }}"

  # Apply semver tag family (major, major.minor, latest) to all images
  publish-tags:
    needs: merge-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to ghcr.io (skopeo)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Apply semver tag family
        run: |
          chmod +x scripts/publish-ci.sh
          IMAGES=(ai-resume-frontend ai-resume-api ai-resume-memvid ai-resume-ingest)
          for IMG in "${IMAGES[@]}"; do
            scripts/publish-ci.sh tag-family "${{ env.REGISTRY }}" "$IMG" "${{ github.ref_name }}"
          done

  # Create GitHub Release with auto-generated notes
  create-release:
    needs: publish-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
