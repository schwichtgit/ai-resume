name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: ai-resume-frontend
          - context: api-service
            image: ai-resume-api
          - context: memvid-service
            image: ai-resume-memvid
          - context: ingest
            image: ai-resume-ingest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build context
        if: matrix.context == 'memvid-service'
        run: cp -r proto/ memvid-service/proto/

      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.image }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
