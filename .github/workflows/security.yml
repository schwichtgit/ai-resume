name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: ai-resume-frontend
          - context: api-service
            image: ai-resume-api
          - context: memvid-service
            image: ai-resume-memvid
          - context: ingest
            image: ai-resume-ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build context
        if: matrix.context == 'memvid-service'
        run: cp -r proto/ memvid-service/proto/

      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.71.2'
          image-ref: '${{ matrix.image }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.image }}'

      - name: Trivy severity gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SEVERITY: CRITICAL,HIGH
          TRIVY_IGNORE_UNFIXED: 'true'
        with:
          version: 'v0.71.2'
          image-ref: '${{ matrix.image }}:scan'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore'

  # Whole-SBOM dependency audit across all ecosystems (npm, pip, cargo) via
  # `task audit`. Complements container-scan: this catches newly-disclosed
  # advisories against already-pinned deps -- the case Dependabot misses
  # (it only fires on dep *changes*), e.g. the msgpack/undici advisories that
  # surfaced against unchanged lockfiles. Fails the run on any unsuppressed
  # finding; suppressions live in per-service .pip-audit-ignore / .trivyignore
  # and frontend/.npm-audit-ignore.
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust (provides cargo for `cargo audit`)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: Install frontend deps (npm audit needs the lockfile resolved)
        run: cd frontend && npm ci

      - name: Check .trivyignore suppressions have not expired
        # A suppression without an enforced review date silently becomes
        # permanent. Runs before the audit so an expired entry is reported even
        # when the audit itself passes.
        run: ./scripts/check-trivyignore-expiry.sh

      - name: Run whole-SBOM dependency audit
        run: task audit

  model-availability:
    # The configured LLM model can be retired upstream at any time, which
    # surfaces to users as a bare 404 from a valid endpoint URL. Free-tier
    # models are retired routinely, so this runs on the weekly schedule to
    # catch it before a user does. The catalogue and endpoint APIs need no
    # API key and perform no inference, so this costs nothing.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Verify the configured LLM model is available
        run: uv run pytest -v -m slow tests/test_openrouter_client.py
