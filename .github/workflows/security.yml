name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: frontend
            image: ai-resume-frontend
          - context: api-service
            image: ai-resume-api
          - context: memvid-service
            image: ai-resume-memvid
          - context: ingest
            image: ai-resume-ingest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare build context
        if: matrix.context == 'memvid-service'
        run: cp -r proto/ memvid-service/proto/

      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}

      # Trivy runs from its official image, pinned by tag and index digest in
      # .github/scanners/trivy/Dockerfile, which Dependabot bumps. The same
      # pin and the same invocation as container-build in ci.yml.
      - name: Resolve the pinned Trivy image
        id: trivy
        run: |
          REF=$(awk '$1 == "FROM" {print $2}' .github/scanners/trivy/Dockerfile)
          test -n "$REF" || { echo "::error::no FROM line in .github/scanners/trivy/Dockerfile"; exit 1; }
          echo "image=${REF}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ubuntu-latest mounts /tmp as a ~7.8G RAM tmpfs with a per-user quota
      # (actions/runner-images#14777), and the ingest image alone exceeds it.
      # The image archive, Trivy's TMPDIR and its DB live under runner.temp,
      # on the root disk.
      - name: Prepare scanner directories
        run: mkdir -p "${RUNNER_TEMP}/scan/tmp" "${RUNNER_TEMP}/trivy-cache/db" "${RUNNER_TEMP}/trivy-cache/java-db"

      - name: Restore the Trivy DB
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/trivy-cache/db
            ${{ runner.temp }}/trivy-cache/java-db
          key: trivy-db-${{ steps.trivy.outputs.date }}
          restore-keys: trivy-db-

      - name: Save the image for Trivy
        env:
          IMAGE: ${{ matrix.image }}
        run: docker save -o "${RUNNER_TEMP}/scan/image.tar" "${IMAGE}:scan"

      # --user keeps the SARIF and the cache owned by the runner, not root.
      - name: Run Trivy vulnerability scanner (SARIF)
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
        run: |
          docker run --rm "$TRIVY_IMAGE" --version
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/scan:/scan" \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" \
            -v "${PWD}:/src" \
            -e TMPDIR=/scan/tmp \
            -e TRIVY_CACHE_DIR=/cache \
            "$TRIVY_IMAGE" image \
            --input /scan/image.tar \
            --ignorefile /src/.trivyignore \
            --format sarif \
            --output /src/trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.image }}'

      - name: Trivy severity gate (CRITICAL/HIGH)
        env:
          TRIVY_IMAGE: ${{ steps.trivy.outputs.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/scan:/scan" \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" \
            -v "${PWD}:/src" \
            -e TMPDIR=/scan/tmp \
            -e TRIVY_CACHE_DIR=/cache \
            -e TRIVY_SEVERITY=CRITICAL,HIGH \
            -e TRIVY_IGNORE_UNFIXED=true \
            "$TRIVY_IMAGE" image \
            --input /scan/image.tar \
            --ignorefile /src/.trivyignore \
            --format table \
            --exit-code 1

  # Whole-SBOM dependency audit across all ecosystems (npm, pip, cargo) via
  # `task audit`. Complements container-scan: this catches newly-disclosed
  # advisories against already-pinned deps -- the case Dependabot misses
  # (it only fires on dep *changes*), e.g. the msgpack/undici advisories that
  # surfaced against unchanged lockfiles. Fails the run on any unsuppressed
  # finding; suppressions live in per-service .pip-audit-ignore / .trivyignore
  # and frontend/.npm-audit-ignore.
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust (provides cargo for `cargo audit`)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: cargo-audit

      - name: Install frontend deps (npm audit needs the lockfile resolved)
        run: cd frontend && npm ci

      - name: Check .trivyignore suppressions have not expired
        # A suppression without an enforced review date silently becomes
        # permanent. Runs before the audit so an expired entry is reported even
        # when the audit itself passes.
        run: ./scripts/check-trivyignore-expiry.sh

      - name: Run whole-SBOM dependency audit
        run: task audit

  model-availability:
    # The configured LLM model can be retired upstream at any time, which
    # surfaces to users as a bare 404 from a valid endpoint URL. Free-tier
    # models are retired routinely, so this runs on the weekly schedule to
    # catch it before a user does. The catalogue and endpoint APIs need no
    # API key and perform no inference, so this costs nothing.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Verify the configured LLM model is available
        run: uv run pytest -v -m slow tests/test_openrouter_client.py
