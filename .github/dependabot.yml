version: 2
updates:
  # npm (frontend)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Python (api-service)
  - package-ecosystem: 'pip'
    directory: '/api-service'
    schedule:
      interval: 'weekly'
    commit-message:
