version: 2
updates:
  # npm (frontend)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      prefix-development: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Python (api-service)
  # 'uv', not 'pip': the pip ecosystem edits pyproject.toml without
  # regenerating uv.lock, which leaves the two out of sync (see #436).
  - package-ecosystem: 'uv'
    directory: '/api-service'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Python (ingest)
  # See api-service above: 'uv' keeps uv.lock in step with pyproject.toml.
  - package-ecosystem: 'uv'
    directory: '/ingest'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Rust (memvid-service)
  - package-ecosystem: 'cargo'
    directory: '/memvid-service'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker (frontend)
  - package-ecosystem: 'docker'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker (api-service)
  - package-ecosystem: 'docker'
    directory: '/api-service'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker (ingest)
  - package-ecosystem: 'docker'
    directory: '/ingest'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker (memvid-service)
  - package-ecosystem: 'docker'
    directory: '/memvid-service'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
