# Markdownlint configuration
default: true

# Disable line length -- impractical for technical docs with tables and URLs
MD013: false

# Allow multiple top-level headings (some docs legitimately have them)
MD025: false

# Allow HTML in markdown (common for badges, details/summary, etc.)
MD033: false

# Allow duplicate headings (page dividers and repeated section names across parents)
MD024: false

# Allow first line to be non-heading (images, badges, frontmatter)
MD041: false
