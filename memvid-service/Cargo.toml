[package]
name = "ai-resume-memvid"
version = "1.0.1"
edition = "2021"
authors = []
description = "Rust-based memvid retrieval service for AI Resume"

[dependencies]
# Web framework (for metrics HTTP endpoint)
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Memvid SDK
memvid-core = { version = "2.0.139", features = ["lex"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# gRPC (for communication with Python service)
tonic = "0.14.5"
tonic-health = "0.14.5"
tonic-prost = "0.14.5"
prost = "0.14"

# Async utilities
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time utilities
chrono = "0.4"

[build-dependencies]
# For gRPC code generation
tonic-prost-build = "0.14.5"

[dev-dependencies]
# HTTP client for integration tests
hyper = "1.9"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# Serialize env-mutating tests to prevent race conditions
serial_test = "3"
# Isolated file copies for memvid exclusive-lock tests
tempfile = "3"
# OTel test utilities
tracing-test = "0.2"

[features]
default = []
# Enable real memvid-core integration (disabled by default for mock testing)
# real-memvid = ["memvid-core"]

[lib]
name = "ai_resume_memvid"
path = "src/lib.rs"

[[bin]]
name = "memvid-service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
