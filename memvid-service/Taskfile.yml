version: '3'

# rustup installs cargo to ~/.cargo/bin, which non-login shells -- the
# agent stop hook among them -- do not have on PATH, so a bare `cargo`
# exits 127 there. A Taskfile `env:` cannot fix it: go-task does not let
# it override a variable the OS already sets, and PATH is always set.
# Resolve the binary once instead; cargo finds its own subcommands
# (clippy, fmt) in ~/.cargo/bin regardless of PATH.
vars:
  CARGO:
    sh: command -v cargo 2>/dev/null || echo "$HOME/.cargo/bin/cargo"

tasks:
  setup:
    desc: Fetch Rust dependencies
    cmds:
      - '{{.CARGO}} fetch'
    status:
      - test -f Cargo.lock

  lint:
    desc: Run clippy with deny warnings
    cmds:
      - '{{.CARGO}} clippy -- -D warnings'

  fmt:
    desc: Format Rust code
    cmds:
      - '{{.CARGO}} fmt'

  fmt:check:
    desc: Check Rust formatting
    cmds:
      - '{{.CARGO}} fmt --check'

  build:
    desc: Build debug
    cmds:
      - '{{.CARGO}} build'

  build:release:
    desc: Build release
    cmds:
      - '{{.CARGO}} build --release'
    sources:
      - src/**/*.rs
      - build.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/memvid-service

  test:
    desc: Run cargo test
    cmds:
      - '{{.CARGO}} test'

  test:coverage:
    desc: Run cargo tarpaulin (unit)
    preconditions:
      - sh: command -v cargo-tarpaulin
        msg: 'cargo-tarpaulin not found. Install: cargo install cargo-tarpaulin'
    cmds:
      - '{{.CARGO}} tarpaulin --config tarpaulin-unit.toml'

  audit:
    desc: Scan Rust dependencies for RUSTSEC advisories (Cargo.lock)
    preconditions:
      - sh: command -v cargo-audit
        msg: 'cargo-audit not found. Install: cargo install --locked cargo-audit'
    cmds:
      - '{{.CARGO}} audit'

  dev:
    desc: Run memvid service
    cmds:
      - '{{.CARGO}} run'
